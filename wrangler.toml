# ============================================================
# GNOSIS MASTER — Standalone Worker config
# Use this for: npx wrangler deploy
# ============================================================
name = "gnosis-master"
main = "src/_worker.ts"
compatibility_date = "2026-02-11"

# ── Workers AI binding ───────────────────────────────────────
[ai]
binding = "AI"

# ── Vectorize — 384-dim RAG index ────────────────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "gnosis-master-index"

# ── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "divination-db"
database_id = "20eb4026-8cc2-4988-b8eb-83670eb2bc81"

# ── R2 Buckets ───────────────────────────────────────────────
[[r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "trinityuniverselibrary"

[[r2_buckets]]
binding = "GNOSIS_CHAT_BUCKET"
bucket_name = "trinityuniversegnosischat"

[[r2_buckets]]
binding = "YADA_CHAT_BUCKET"
bucket_name = "trinityuniverseyadachat"

[[r2_buckets]]
binding = "MASTER_BUCKET"
bucket_name = "master-bucket"

[[r2_buckets]]
binding = "TRINITY_EBOOKS"
bucket_name = "trinity-universe-ebooks"

[[r2_buckets]]
binding = "LOBE_AGRI"
bucket_name = "gnosis-agriculture"

[[r2_buckets]]
binding = "LOBE_ART"
bucket_name = "gnosis-art-culture-fashion"

[[r2_buckets]]
binding = "LOBE_BIZ"
bucket_name = "gnosis-business"

[[r2_buckets]]
binding = "LOBE_CREATE"
bucket_name = "gnosis-creativity"

[[r2_buckets]]
binding = "LOBE_DICT"
bucket_name = "gnosis-dictionary"

[[r2_buckets]]
binding = "LOBE_EDU"
bucket_name = "gnosis-education"

[[r2_buckets]]
binding = "LOBE_GOVT"
bucket_name = "gnosis-government"

[[r2_buckets]]
binding = "LOBE_HEALTH"
bucket_name = "gnosis-health"

[[r2_buckets]]
binding = "LOBE_PSYCH"
