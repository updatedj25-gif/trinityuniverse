[[r2_buckets]]
binding = "LOBE_SCI"
bucket_name = "gnosis-science"

[[r2_buckets]]
binding = "LOBE_TECH"
bucket_name = "gnosis-technology"

[[r2_buckets]]
binding = "LOBE_TEST"
bucket_name = "ai-orchestrator-test-bucket"

# ── KV Namespaces ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "GNOSIS_SESSIONS"
id = "687656e74c8e4cbaad18d35c75f700bb"

